<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>티키탁</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #ffffff;
        color: #171719;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
      }
      p {
        margin: 8px 0 0;
        font-size: 15px;
        line-height: 1.5;
        color: rgba(55, 56, 60, 0.61);
      }
      button {
        margin-top: 32px;
        padding: 14px 32px;
        border: 0;
        border-radius: 20px;
        background: #38bdf8;
        color: #ffffff;
        font-size: 16px;
        font-weight: 600;
      }
      button:active {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <h1>연결할 수 없어요</h1>
    <p>인터넷 연결을 확인한 뒤<br />다시 시도해 주세요</p>
    <button type="button" id="retry">다시 시도</button>
    <script>
      document.getElementById('retry').addEventListener('click', function () {
        window.location.href = 'https://app.tikitak.space';
      });
    </script>
  </body>
</html>
